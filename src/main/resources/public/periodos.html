<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6e4f" />
  <link rel="icon" type="image/png" href="logo-marca-ut.png" />
  <title>Periodos académicos - Universidad del Tolima</title>
  <link rel="stylesheet" href="marca.css" />
  <link rel="stylesheet" href="modulos.css" />
</head>
<body data-modulo="periodos">
  <div class="container">
    <div class="header">
      <a class="marca-institucional" href="menu.html">
        <img class="logo-ut" src="logo-marca-ut.png" alt="Marca de la Universidad del Tolima" width="46" height="46" />
        <span class="marca-texto">
          <strong>Universidad del Tolima</strong>
          <small>Sistema Académico</small>
        </span>
      </a>
      <a class="back boton boton-suave" href="menu.html">Volver al panel</a>
    </div>

    <h2 id="titulo">Periodos académicos</h2>

    <p class="ayuda" id="ayuda"></p>
    <div class="filtros" id="filtros" hidden></div>

    <form class="formulario" id="formulario">
      <div class="campos" id="campos"></div>
      <div class="botones">
        <button id="guardar" type="submit">Registrar</button>
        <button id="cancelar" class="secondary" type="button" hidden>Cancelar</button>
      </div>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <p class="contador" id="contador"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="encabezados"></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
      <p id="vacio" hidden>No hay registros para mostrar.</p>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="modulos.js"></script>
</body>
</html>
