<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6e4f" />
  <title>Iniciar sesión - Universidad del Tolima</title>
  <link rel="icon" type="image/png" href="logo-marca-ut.png" />
  <link rel="stylesheet" href="marca.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(760px 420px at 8% -6%, var(--verde-100), transparent 62%),
        radial-gradient(680px 380px at 104% 106%, var(--oro-100), transparent 60%),
        var(--neutro-fondo);
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: var(--neutro-panel);
      border: 1px solid var(--neutro-borde);
      border-radius: var(--radio-l);
      box-shadow: var(--sombra-l);
      padding: 30px 30px 26px;
    }

    .marca-login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--neutro-borde);
    }

    .logo-completo {
      width: 250px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      transition: transform 0.25s var(--salto);
    }

    .marca-login:hover .logo-completo { transform: scale(1.03); }

    .marca-login small {
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--neutro-muted);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--verde-900);
    }

    .subtitulo {
      margin: 0 0 18px;
      color: var(--neutro-muted);
      font-size: 0.92rem;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 0.9rem;
      font-weight: 650;
      color: var(--neutro-tinta);
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border-radius: var(--radio-m);
      border: 1px solid var(--neutro-borde);
      background: #fff;
      color: var(--neutro-tinta);
      font: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:hover { border-color: var(--verde-500); }

    input:focus {
      border-color: var(--verde-700);
      box-shadow: 0 0 0 3px var(--verde-100);
    }

    button { width: 100%; margin-top: 24px; min-height: 48px; font-size: 1rem; }

    #message {
      margin-top: 16px;
      min-height: 20px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--peligro);
    }

    .pie {
      margin: 18px 0 0;
      text-align: center;
      font-size: 0.76rem;
      letter-spacing: 0.4px;
      color: var(--neutro-muted);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="marca-login">
      <img class="logo-completo" src="logo-ut.png" alt="Logo de la Universidad del Tolima" width="250" height="157" />
      <small>Sistema Académico</small>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="subtitulo">Use las credenciales asignadas por la oficina de registro.</p>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" placeholder="Escriba su usuario" autocomplete="username" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Escriba su contraseña" autocomplete="current-password" required />

      <button class="boton" type="submit">Ingresar</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <p class="pie">Acceso exclusivo para el equipo local donde está corriendo el servidor</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
