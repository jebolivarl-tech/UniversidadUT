<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión - Sistema Universitario</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #1f2023;
      --panel: #2b2b2b;
      --control: #3c3f41;
      --texto: #f2f2f2;
      --muted: #b5b9bc;
      --borde: #55595c;
      --focus: #8ab4f8;
      --danger: #ff8585;
      --success: #79c99e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 6px;
      box-shadow: 0 16px 40px rgb(0 0 0 / 24%);
      padding: 24px 26px;
    }

    .brand {
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.6px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 2.05rem;
      color: var(--texto);
      font-weight: 700;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-size: 0.95rem;
      color: var(--texto);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid var(--borde);
      background: var(--control);
      color: var(--texto);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgb(138 180 248 / 25%);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 18px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: var(--control);
      color: var(--texto);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    button:hover {
      background: #484c4f;
      border-color: #74797d;
    }

    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    #message {
      margin-top: 18px;
      min-height: 20px;
      text-align: center;
      font-size: 0.92rem;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">Universidad del Tolima</div>
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" placeholder="Ingrese usuario" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Ingrese contraseña" required />

      <button type="submit">Ingresar</button>
    </form>

    <div id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
