<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6e4f" />
  <link rel="icon" type="image/png" href="logo-marca-ut.png" />
  <title>Mi información - Universidad del Tolima</title>
  <link rel="stylesheet" href="marca.css" />
  <link rel="stylesheet" href="modulos.css" />
</head>
<body data-modulo="mi">
  <div class="container">
    <div class="header">
      <a class="marca-institucional" href="menu.html">
        <img class="logo-ut" src="logo-marca-ut.png" alt="Marca de la Universidad del Tolima" width="46" height="46" />
        <span class="marca-texto">
          <strong>Universidad del Tolima</strong>
          <small>Sistema Académico</small>
        </span>
      </a>
      <a class="back boton boton-suave" href="menu.html">Volver al panel</a>
    </div>

    <h2>Mi información</h2>

    <div id="message" role="status" aria-live="polite"></div>

    <!-- Tarjetas con los datos de la persona conectada; las llena el script del final -->
    <section class="tarjetas" id="resumen" aria-label="Resumen"></section>

    <!-- Los encabezados y el cuerpo de cada tabla quedan vacíos aquí: el script los escribe -->
    <section id="secciones">
      <h3 id="tituloSecciones">Mis secciones</h3>
      <div class="table-wrap">
        <table>
          <thead><tr id="encabezadosSecciones"></tr></thead>
          <tbody id="tablaSecciones"></tbody>
        </table>
      </div>
    </section>

    <section id="notas">
      <h3 id="tituloNotas">Mis calificaciones</h3>
      <div class="table-wrap">
        <table>
          <thead><tr id="encabezadosNotas"></tr></thead>
          <tbody id="tablaNotas"></tbody>
        </table>
      </div>
    </section>

    <section id="asistencias">
      <h3 id="tituloAsistencias">Mis asistencias</h3>
      <div class="table-wrap">
        <table>
          <thead><tr id="encabezadosAsistencias"></tr></thead>
          <tbody id="tablaAsistencias"></tbody>
        </table>
      </div>
    </section>

    <!-- Oculta hasta saber que quien entró es estudiante -->
    <section id="matriculas" hidden>
      <h3>Mis matrículas</h3>
      <div class="table-wrap">
        <table>
          <thead><tr id="encabezadosMatriculas"></tr></thead>
          <tbody id="tablaMatriculas"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
  <script>
    /*
     * Hoja de nombres: Java manda los datos del perfil con claves en inglés (rol, promedioGeneral…)
     * y aquí se traduce cada una al rótulo que ve la persona en la tarjeta.
     */
    const ETIQUETAS = {
      username: 'Usuario', rol: 'Rol', estudiante: 'Estudiante', email: 'Correo',
      carrera: 'Carrera', facultad: 'Facultad', profesor: 'Profesor',
      materiasCalificadas: 'Materias calificadas', materiasAprobadas: 'Materias aprobadas',
      promedioGeneral: 'Promedio general', controles: 'Controles registrados',
      porcentajeAsistencia: '% de asistencia', secciones: 'Secciones a mi cargo',
      materiasPerdidasPorAsistencia: 'Perdidas por asistencia',
    };

    // Pide un dato a la API REST con las cookies de la sesión y devuelve lo que llega convertido de
    // JSON. El 403 quiere decir "ese rol no tiene permiso para ver esto", y se traduce en null para
    // saltarse esa parte de la página; los demás fallos se lanzan para escribirlos arriba.
    async function leerJson(ruta) {
      const response = await fetch(`${API_BASE_URL}${ruta}`, { credentials: 'include' });
      if (!response.ok) {
        if (response.status === 403) return null;
        throw new Error(await responseError(response));
      }
      return response.json();
    }

    // Escribe una tarjeta por cada dato suelto del perfil. Las listas se dejan para las tablas.
    function pintarResumen(perfil) {
      const contenedor = document.getElementById('resumen');
      contenedor.textContent = '';
      for (const [clave, valor] of Object.entries(perfil)) {
        if (Array.isArray(valor)) continue;
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta';
        const numero = document.createElement('strong');
        numero.textContent = valor === null || valor === undefined || valor === '' ? '—' : String(valor);
        const titulo = document.createElement('span');
        titulo.textContent = ETIQUETAS[clave] || clave;
        tarjeta.append(numero, titulo);
        contenedor.appendChild(tarjeta);
      }
    }

    // Escribe el encabezado y las filas de una de las tablas. Java manda las claves con mayúsculas
    // internas (notaParcial1), así que aquí se pasan todas a minúsculas para poder compararlas con las
    // columnas pedidas. Sin filas se deja un solo aviso de "Sin registros.".
    function pintarTabla(prefijo, filas, columnas) {
      const cabecera = document.getElementById(`encabezados${prefijo}`);
      const cuerpo = document.getElementById(`tabla${prefijo}`);
      cabecera.textContent = '';
      cuerpo.textContent = '';
      for (const columna of columnas) {
        const th = document.createElement('th');
        th.textContent = columna.etiqueta;
        cabecera.appendChild(th);
      }
      if (!filas || filas.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = columnas.length;
        td.textContent = 'Sin registros.';
        tr.appendChild(td);
        cuerpo.appendChild(tr);
        return;
      }
      for (const fila of filas) {
        const tr = document.createElement('tr');
        const planas = {};
        for (const clave of Object.keys(fila)) planas[clave.toLowerCase()] = fila[clave];
        for (const columna of columnas) {
          const td = document.createElement('td');
          const valor = planas[columna.clave];
          td.textContent = columna.formato === 'fecha' ? formatDateForDisplay(valor) : (valor ?? '');
          tr.appendChild(td);
        }
        cuerpo.appendChild(tr);
      }
    }

    /*
     * Primero se pide el perfil, y según el rol se muestran unas tablas u otras.
     * El administrativo no necesita este resumen: consulta cada módulo desde el panel, así que aquí se
     * ocultan las tablas y solo se le dejan sus datos de cuenta.
     */
    async function iniciar() {
      let perfil;
      try {
        perfil = await leerJson('/api/mi');
      } catch (error) {
        showMessage(error.message, true);
        return;
      }
      if (!perfil) return;
      pintarResumen(perfil);

      if (perfil.rol === 'ADMINISTRATIVO') {
        for (const id of ['secciones', 'notas', 'asistencias', 'matriculas']) {
          document.getElementById(id).hidden = true;
        }
        showMessage('En su rol los datos se consultan por módulo desde el panel.', false);
        return;
      }

      const esEstudiante = perfil.rol === 'ESTUDIANTE';
      // Al profesor estos datos le salen solo de los grupos que él dicta; se los filtra Java.
      const secciones = await leerJson('/api/mi/secciones');
      pintarTabla('Secciones', secciones, [
        { clave: 'curso', etiqueta: 'Curso' }, { clave: 'profesor', etiqueta: 'Profesor' },
        { clave: 'periodo', etiqueta: 'Periodo' }, { clave: 'aula', etiqueta: 'Aula' },
        { clave: 'ocupacion', etiqueta: 'Ocupación' },
      ]);

      const notas = await leerJson('/api/mi/calificaciones');
      // El mismo dato cambia de nombre según quién lo vea: las suyas, o las de sus grupos.
      if (esEstudiante) document.getElementById('tituloNotas').textContent = 'Mis calificaciones';
      else document.getElementById('tituloNotas').textContent = 'Calificaciones de mis secciones';
      pintarTabla('Notas', notas, [
        { clave: 'curso', etiqueta: 'Curso' }, { clave: 'notaparcial1', etiqueta: 'Parcial 1' },
        { clave: 'notaparcial2', etiqueta: 'Parcial 2' }, { clave: 'notaexamenfinal', etiqueta: 'Examen final' },
        { clave: 'promediofinal', etiqueta: 'Promedio' }, { clave: 'estado', etiqueta: 'Estado' },
      ]);

      const asistencias = await leerJson('/api/mi/asistencias');
      if (!esEstudiante) {
        document.getElementById('tituloAsistencias').textContent = 'Controles de asistencia de mis secciones';
      }
      pintarTabla('Asistencias', asistencias, [
        { clave: 'curso', etiqueta: 'Curso' }, { clave: 'fecha', etiqueta: 'Fecha', formato: 'fecha' },
        { clave: 'estado', etiqueta: 'Estado' },
      ]);

      if (esEstudiante) {
        // La tabla de matrículas viene oculta en el HTML: solo al estudiante le interesa la suya.
        document.getElementById('matriculas').hidden = false;
        const matriculas = await leerJson('/api/mi/matriculas');
        pintarTabla('Matriculas', matriculas, [
          { clave: 'curso', etiqueta: 'Curso' }, { clave: 'creditos', etiqueta: 'Créditos' },
          { clave: 'periodo', etiqueta: 'Periodo' }, { clave: 'nota', etiqueta: 'Nota' },
          { clave: 'estado', etiqueta: 'Estado' },
        ]);
      }
    }

    iniciar();
  </script>
</body>
</html>
